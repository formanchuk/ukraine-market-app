<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UAMO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #151520;
            --bg-input: #1a1a2a;
            --blue-primary: #00a3ff;
            --text-primary: #f0f4ff;
            --text-secondary: #8899bb;
            --text-dim: #556688;
            --border-color: rgba(0, 163, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 75px;
        }
        .app-container { padding: 14px; padding-bottom: 80px; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .goods-card, .my-goods-card, .fresh-card, .job-card, .resume-card, .chat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .goods-card:hover, .chat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 163, 255, 0.3);
        }
        .goods-card { border-left: 3px solid var(--blue-primary); }
        .job-card { border-left: 3px solid #ff6b00; }
        .resume-card { border-left: 3px solid #00c853; }
        .chat-card { border-left: 3px solid #af52de; }

        .btn-primary, .nav-item.active, .profile-tab.active {
            background: linear-gradient(135deg, var(--blue-primary), #0077cc);
            box-shadow: 0 0 30px rgba(0, 163, 255, 0.15);
        }
        .btn-primary { border: none; color: white; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; transition: 0.2s; }
        .btn-secondary {
            border: none;
            color: var(--text-primary);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .goods-price, .job-salary { color: var(--blue-primary); }
        .section-title {
            color: var(--blue-primary);
            font-size: 16px;
            font-weight: 600;
            margin: 16px 0 12px 0;
            letter-spacing: 0.5px;
        }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--blue-primary);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 163, 255, 0.1);
        }

        /* НАВІГАЦІЯ (5 кнопок) */
        .bottom-nav {
            background: rgba(10, 10, 15, 0.95);
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 8px 8px 16px;
            z-index: 100;
        }
        .nav-item {
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 12px;
            border-radius: 14px;
            cursor: pointer;
            min-width: 50px;
            transition: 0.2s;
            font-size: 10px;
        }
        .nav-item .nav-icon { font-size: 22px; }
        .nav-item .nav-label { font-size: 9px; font-weight: 500; }
        .nav-item.active {
            background: rgba(0, 163, 255, 0.1);
            color: var(--blue-primary);
        }
        .nav-item:active { transform: scale(0.92); }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .header h2 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .back-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 8px; color: var(--text-primary); }

        .header-home {
            margin-bottom: 16px;
            background: var(--bg-secondary);
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-home .logo-text { font-size: 20px; }
        .header-home .notif-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px 10px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .header-home .notif-btn:hover { background: var(--bg-card); }

        .search-container {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }
        .search-container .search-box { flex: 1; margin-bottom: 0; }

        .search-box {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .search-box:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 30px rgba(0, 163, 255, 0.05);
        }

        .search-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* КАТЕГОРІЇ (2 В РЯД) */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .category-item {
            background: var(--bg-card);
            padding: 16px 12px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .category-item:active { transform: scale(0.95); }
        .category-item.active-category {
            background: rgba(0, 163, 255, 0.08);
            border-color: var(--blue-primary);
        }
        .category-item .category-icon { font-size: 28px; }
        .category-item .category-name { font-size: 11px; font-weight: 500; color: var(--text-secondary); }

        .modal-input, .modal-select, .modal-textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .modal-input:focus, .modal-select:focus, .modal-textarea:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 30px rgba(0, 163, 255, 0.05);
        }
        .modal-select option { background: var(--bg-primary); color: var(--text-primary); }

        .profile-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-name { color: var(--text-primary); font-size: 22px; font-weight: 700; }
        .stat-number { color: var(--blue-primary); font-size: 22px; font-weight: 700; }
        .stat-label { color: var(--text-secondary); font-size: 11px; }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .profile-stats .stat-item { text-align: center; min-width: 50px; }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid var(--blue-primary);
            margin: 0 auto 12px;
            transition: 0.3s;
        }
        .profile-avatar:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 163, 255, 0.2); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .profile-tabs, .jobs-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .profile-tab, .jobs-tab {
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-secondary);
            transition: 0.2s;
            border: 1px solid var(--border-color);
        }
        .profile-tab.active, .jobs-tab.active {
            background: rgba(0, 163, 255, 0.1);
            color: var(--blue-primary);
            border-color: var(--blue-primary);
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 8px;
            max-height: 65vh;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            word-wrap: break-word;
        }
        .chat-message.own {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--blue-primary), #0077cc);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-message.other {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .chat-message .chat-time { font-size: 10px; opacity: 0.5; margin-left: 6px; }
        .chat-input {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: sticky;
            bottom: 0;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
        }
        .chat-input button {
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--blue-primary), #0077cc);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .rating-stars { display: flex; gap: 4px; font-size: 28px; cursor: pointer; justify-content: center; margin: 10px 0; }
        .rating-stars .star { color: #445566; transition: 0.2s; }
        .rating-stars .star.active { color: #ffcc00; text-shadow: 0 0 20px rgba(255, 204, 0, 0.3); }
        .rating-stars .star:hover { transform: scale(1.2); }

        .my-goods-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .action-btn {
            padding: 8px 4px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: white;
            text-align: center;
        }
        .action-view { background: var(--blue-primary); }
        .action-edit { background: #ff8c00; }
        .action-delete { background: #ff3355; }
        .action-archive { background: #9c27b0; }
        .action-restore { background: #00c853; }

        .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .photo-preview {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: var(--bg-input);
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .photo-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            background: red;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }
        .add-photo {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 16px;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .goods-image, .my-goods-image, .fresh-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-size: contain;
            background-repeat: no-repeat;
            background-color: var(--bg-input);
            background-position: center;
            flex-shrink: 0;
        }
        .goods-card, .fresh-card { display: flex; gap: 12px; align-items: center; }
        .goods-info { flex: 1; }
        .goods-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .goods-meta { font-size: 12px; color: var(--text-secondary); }

        .detail-photo-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 16px;
            margin-bottom: 16px;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-swipe-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; }
        .photo-swipe-container img { width: 100%; height: 100%; object-fit: contain; scroll-snap-align: start; flex-shrink: 0; }
        .photo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: 0.2s;
        }
        .photo-dot.active { background: white; width: 20px; border-radius: 4px; }
        .photo-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }
        .photo-arrow.left { left: 10px; }
        .photo-arrow.right { right: 10px; }
        .photo-nav {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto;
        }

        .detail-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .detail-price { font-size: 24px; font-weight: 700; color: var(--blue-primary); margin-bottom: 10px; }
        .detail-row { margin-bottom: 8px; font-size: 14px; }
        .detail-label { color: var(--text-secondary); margin-right: 6px; }
        .detail-phone-box {
            background: var(--bg-card);
            padding: 14px;
            border-radius: 12px;
            margin: 16px 0;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .contact-seller {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--blue-primary), #0077cc);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s;
        }
        .contact-seller:hover { box-shadow: 0 0 30px rgba(0, 163, 255, 0.2); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .message-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--blue-primary);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 300;
            display: none;
            font-size: 14px;
            white-space: nowrap;
        }
        .fab { display: none; }

        .modal, .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-content, .detail-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 92%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; color: var(--text-primary); }

        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .confirm-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 300px;
            text-align: center;
        }
        .confirm-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
        .confirm-message { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
        .confirm-buttons { display: flex; gap: 12px; }
        .confirm-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .confirm-yes { background: var(--blue-primary); color: white; }
        .confirm-no { background: #dc3545; color: white; }

        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; margin-left: 6px; }
        .status-active { background: #00c853; color: white; }
        .status-archived { background: #9c27b0; color: white; }

        .favorite-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
            padding: 4px 8px;
        }
        .favorite-btn.active { color: #ff3355; }
        .favorite-btn:active { transform: scale(0.9); }

        @keyframes ripple {
            0% { width: 80px; height: 80px; opacity: 0.8; }
            100% { width: 280px; height: 280px; opacity: 0; }
        }
        ::-webkit-scrollbar { width: 3px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--blue-primary), #0077cc); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }
        input:focus, textarea:focus, select:focus {
            outline: 2px solid var(--blue-primary);
            outline-offset: 2px;
        }

        .help-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .help-buttons .btn-secondary {
            padding: 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .favorites-empty {
            text-align: center;
            padding: 60px 20px;
        }
        .favorites-empty .heart-icon {
            font-size: 64px;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .favorites-empty .favorites-title {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .favorites-empty .favorites-sub {
            font-size: 14px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div id="splash" style="position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a0f; display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="position:relative;">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:200px; height:200px; border-radius:50%; background:rgba(0,163,255,0.15); animation:ripple 1.8s infinite;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:200px; height:200px; border-radius:50%; background:rgba(0,163,255,0.1); animation:ripple 1.8s infinite 0.6s;"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:200px; height:200px; border-radius:50%; background:rgba(0,163,255,0.05); animation:ripple 1.8s infinite 1.2s;"></div>
        <div style="font-size:64px; font-weight:700; color:#00a3ff; text-shadow:0 0 30px rgba(0,163,255,0.5); position:relative; z-index:1; letter-spacing:4px;">UAMO</div>
    </div>
</div>

<div id="app"></div>

<div class="bottom-nav" id="bottomNav">
    <div class="nav-item" data-page="home"><div class="nav-icon">🏠</div><div class="nav-label">Головна</div></div>
    <div class="nav-item" data-page="favorites"><div class="nav-icon">❤️</div><div class="nav-label">Вибране</div></div>
    <div class="nav-item" data-page="create"><div class="nav-icon">➕</div><div class="nav-label">Створити</div></div>
    <div class="nav-item" data-page="chats"><div class="nav-icon">💬</div><div class="nav-label">Чати</div></div>
    <div class="nav-item" data-page="profile"><div class="nav-icon">👤</div><div class="nav-label">Профіль</div></div>
</div>

<div id="message" class="message-toast"></div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">📝 Деталі оголошення</div>
        <div class="photo-grid" id="photoList"></div>
        <div class="add-photo" onclick="addPhotoInput()">➕ Додати фото</div>
        <input type="text" id="goodsTitle" class="modal-input" placeholder="Заголовок оголошення">
        <select id="goodsCategory" class="modal-select">
            <option value="">📌 Категорія</option>
            <option value="Електроніка">📱 Електроніка</option>
            <option value="Авто">🚗 Авто</option>

        <div id="detailContent"></div>

    </div>
</div>

<div id="confirmDialog" style="display:none;"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ============================================
    // ПРАВИЛЬНІ КЛЮЧІ
    // ============================================
    const SUPABASE_URL = 'https://qupsmelpssgniwohjbxz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qm9h6LpIJAqwvH6-Q9yxZw_VhmgZbvq';
    const CURRENT_USER_ID = "1";

    let currentPhotoIndex = 0;
    let currentPhotos = [];
    let isSubmitting = false;
    let isLoading = false;
    let lastScrollTop = 0;
    let isModalOpen = false;
    let selectedPhotos = [];
    let state = {
        page: 'home',
        category: null,
        categoryPage: null,
        goods: [],
        myGoods: [],
        jobs: [],
        resumes: [],
        myJobs: [],
        myResumes: [],
        favorites: [],
        profileTab: 'active',
        jobsTab: 'jobs',
        user: { id: CURRENT_USER_ID, first_name: 'Користувач', phone: '', avatar_url: '' },
        chats: [],
        notifications: [],
        currentChat: null
    };
    let dataCache = { goods: null, myGoods: null, jobs: null, resumes: null, myJobs: null, myResumes: null, chats: null, notifications: null, favorites: null, lastUpdate: {} };
    const CACHE_TIME = 30000;
    function isCacheValid(key) { return dataCache[key] && dataCache.lastUpdate[key] && (Date.now() - dataCache.lastUpdate[key]) < CACHE_TIME; }

    function setActiveNav(page) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const active = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (active) active.classList.add('active');
    }

    function escapeHtml(text) { if (!text) return ''; return String(text).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
    function getStatusBadge(status) { if (status === 'active') return '<span class="status-badge status-active">✓ Активне</span>'; if (status === 'archived') return '<span class="status-badge status-archived">📦 В архіві</span>'; return ''; }

    function showMessage(text, isError = false) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.style.background = isError ? '#dc3545' : '#2aab6e';
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 2500);
    }

    function getPhotosArray(photos) {
        if (!photos) return [];
        try {
            if (typeof photos === 'string') {
                if (photos.startsWith('[')) return JSON.parse(photos);
                else if (photos.includes(',')) return photos.split(',');
                else if (photos.startsWith('http')) return [photos];
            }
            if (Array.isArray(photos)) return photos;
            return [];
        } catch(e) { return []; }
    }
    function getFirstPhoto(photos) { const arr = getPhotosArray(photos); return arr.length > 0 ? arr[0] : ''; }

    async function apiRequest(endpoint, options = {}) {
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
                ...options,
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            });
            if (res.status === 204) return [];
            if (res.status === 201 || res.status === 200) {
                const text = await res.text();
                if (text && text.length > 0) { try { return JSON.parse(text); } catch(e){ return []; } }
                return [];
            }
            if (!res.ok) return [];
            const text = await res.text();
            if (text && text.length > 0) { try { return JSON.parse(text); } catch(e){ return []; } }
            return [];
        } catch(e) { console.error('Fetch error:', e); return []; }
    }

    function addPhotoInput() {
        if (selectedPhotos.length >= 15) { showMessage('Максимум 15 фото', true); return; }
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    selectedPhotos.push(ev.target.result);
                    renderPhotoList();
                    showMessage(`📸 Додано фото (${selectedPhotos.length}/15)`);
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }
    function renderPhotoList() {
        const container = document.getElementById('photoList');
        if (!container) return;
        if (selectedPhotos.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = selectedPhotos.map((p, i) =>
            `<div class="photo-preview" style="background-image: url('${p}')"><div class="photo-remove" onclick="removePhoto(${i})">×</div></div>`
        ).join('');
    }
    function removePhoto(i) { selectedPhotos.splice(i, 1); renderPhotoList(); showMessage(`Фото видалено (${selectedPhotos.length}/15)`); }

    function detectUserCity() {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude, longitude } = pos.coords;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
                const data = await res.json();
                const city = data.address?.city || data.address?.town || data.address?.village || '';
                if (city) {
                    document.getElementById('goodsCity').value = city;
                    localStorage.setItem('userCity', city);
                }
            } catch(e) {}
        }, () => {});
    }

    // ========== USER ==========
    async function loadUser() {
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        let userId = tgUser?.id ? String(tgUser.id) : null;
        const userName = tgUser?.first_name || 'Користувач';
        if (!userId) { userId = '1'; }
        state.user = { id: userId, first_name: userName, phone: localStorage.getItem(`userPhone_${userId}`) || '', avatar_url: '' };
        try {
            let users = await apiRequest(`users?id=eq.${userId}&select=*`);
            if (!users || users.length === 0) {
                await apiRequest('users', { method: 'POST', body: JSON.stringify({ id: userId, first_name: userName, phone: state.user.phone || '', created_at: new Date().toISOString() }) });
            } else {
                if (users[0]?.phone) { state.user.phone = users[0].phone; localStorage.setItem(`userPhone_${userId}`, users[0].phone); }
                if (users[0]?.rating) { state.user.rating = users[0].rating; }
                if (users[0]?.avatar_url) { state.user.avatar_url = users[0].avatar_url; }
            }
        } catch(e) {}
    }

    // ========== GOODS ==========
    async function loadGoods(force = false) {
        if (!force && isCacheValid('goods')) { state.goods = dataCache.goods; if (state.page === 'goods') renderGoodsPage(); if (state.page === 'home') renderHomePage(); return; }
        try {
            let url = `goods?select=*&status=eq.active&order=created_at.desc&limit=500`;
            if (state.categoryPage && state.categoryPage !== 'Всі' && state.categoryPage !== 'all') {
                url = `goods?select=*&status=eq.active&category=eq.${encodeURIComponent(state.categoryPage)}&order=created_at.desc&limit=500`;
            }
            const data = await apiRequest(url);
            state.goods = data || [];
            dataCache.goods = state.goods;
            dataCache.lastUpdate.goods = Date.now();
            if (state.page === 'goods') renderGoodsPage();
            if (state.page === 'home') renderHomePage();
        } catch(e) { state.goods = []; }
    }

    async function loadMyGoods(force = false) {
        if (!state.user) return;
        try {
            const data = await apiRequest(`goods?select=*&user_id=eq.${state.user.id}&order=created_at.desc&limit=500`);
            state.myGoods = (data && Array.isArray(data)) ? data.filter(item => String(item.user_id) === String(state.user.id)) : [];
            if (state.page === 'profile') renderProfilePage();
        } catch(e) { state.myGoods = []; }
    }

    async function loadJobs(force = false) {
        if (!force && isCacheValid('jobs')) { state.jobs = dataCache.jobs; if (state.page === 'jobs' && state.jobsTab === 'jobs') renderJobsPage(); if (state.page === 'home') renderHomePage(); return; }
        try {
            const data = await apiRequest('jobs?select=*&status=eq.open&order=created_at.desc&limit=500');
            state.jobs = data || [];
            dataCache.jobs = state.jobs;
            dataCache.lastUpdate.jobs = Date.now();
            if (state.page === 'jobs' && state.jobsTab === 'jobs') renderJobsPage();
            if (state.page === 'home') renderHomePage();
        } catch(e) { state.jobs = []; }
    }

    async function loadResumes(force = false) {
        if (!force && isCacheValid('resumes')) { state.resumes = dataCache.resumes; if (state.page === 'jobs' && state.jobsTab === 'resumes') renderJobsPage(); if (state.page === 'home') renderHomePage(); return; }
        try {
            const data = await apiRequest('resumes?select=*&status=eq.active&order=created_at.desc&limit=500');
            state.resumes = data || [];
            dataCache.resumes = state.resumes;
            dataCache.lastUpdate.resumes = Date.now();
            if (state.page === 'jobs' && state.jobsTab === 'resumes') renderJobsPage();
            if (state.page === 'home') renderHomePage();
        } catch(e) { state.resumes = []; }
    }

    async function loadMyJobs(force = false) {
        if (!state.user) return;
        try {
            const data = await apiRequest(`jobs?select=*&user_id=eq.${state.user.id}&order=created_at.desc&limit=500`);
            state.myJobs = (data && Array.isArray(data)) ? data.filter(item => String(item.user_id) === String(state.user.id)) : [];
            if (state.page === 'profile') renderProfilePage();
        } catch(e) { state.myJobs = []; }
    }

    async function loadMyResumes(force = false) {
        if (!state.user) return;
        try {
            const data = await apiRequest(`resumes?select=*&user_id=eq.${state.user.id}&order=created_at.desc&limit=500`);
            state.myResumes = (data && Array.isArray(data)) ? data.filter(item => String(item.user_id) === String(state.user.id)) : [];
            if (state.page === 'profile') renderProfilePage();
        } catch(e) { state.myResumes = []; }
    }

    // ========== FAVORITES ==========
    async function loadFavorites() {
        try {
            const data = await apiRequest(`favorites?user_id=eq.${state.user.id}&select=*,goods(*)`);
            state.favorites = data || [];
            dataCache.favorites = state.favorites;
            dataCache.lastUpdate.favorites = Date.now();
            if (state.page === 'favorites') renderFavoritesPage();
        } catch(e) { state.favorites = []; }
    }

    async function toggleFavorite(adId) {
        const exists = state.favorites.find(f => f.ad_id === adId);
        if (exists) {
            await apiRequest(`favorites?id=eq.${exists.id}`, { method: 'DELETE' });
            state.favorites = state.favorites.filter(f => f.ad_id !== adId);
            showMessage('💔 Видалено з вибраного');
        } else {
            await apiRequest('favorites', {
                method: 'POST',
                body: JSON.stringify({ user_id: state.user.id, ad_id: adId })
            });
            await loadFavorites();
            showMessage('❤️ Додано до вибраного');
        }
        if (state.page === 'favorites') renderFavoritesPage();
    }

    function renderFavoritesPage() {
        const favs = state.favorites || [];
        document.getElementById('app').innerHTML = `
            <div class="app-container">
                <div class="header"><h2>❤️ Вибране</h2></div>
                <div style="display:flex; gap:16px; color:var(--text-secondary); font-size:14px; margin-bottom:16px;">
                    <span>Оголошення ${favs.length}/50</span>
                    <span>Пошук 0/50</span>
                </div>
                ${favs.length === 0 ? `
                    <div class="favorites-empty">
                        <div class="heart-icon">❤️</div>
                        <div class="favorites-title">Збережіть цікаві оголошення</div>
                        <div class="favorites-sub">Натисніть на сердечко ❤️ біля оголошення</div>
                    </div>
                ` : favs.map(f => `
                    <div class="goods-card" onclick="openDetail(${f.ad_id}, 'goods')">
                        <div class="goods-image" style="background-image:url('${getFirstPhoto(f.goods?.photos)}')"></div>
                        <div class="goods-info">
                            <div class="goods-title">${escapeHtml(f.goods?.title)}</div>
                            <div class="goods-price">💰 ${escapeHtml(f.goods?.price)} грн</div>
                            <div class="goods-meta">${escapeHtml(f.goods?.category)}</div>
                        </div>
                        <button class="favorite-btn active" onclick="event.stopPropagation(); toggleFavorite(${f.ad_id})">❤️</button>
                    </div>
                `).join('')}
            </div>
        `;
        setActiveNav('favorites');
    }

    // ========== CHATS ==========
    async function loadMyChats() {
        try {
            const chats1 = await apiRequest(`chats?buyer_id=eq.${state.user.id}&order=last_message_time.desc&select=*,goods(title)`);
            const chats2 = await apiRequest(`chats?seller_id=eq.${state.user.id}&order=last_message_time.desc&select=*,goods(title)`);
            const all = [...(chats1||[]), ...(chats2||[])];
            const unique = {};
            all.forEach(c => unique[c.id] = c);
            state.chats = Object.values(unique);
            state.chats.sort((a,b) => new Date(b.last_message_time) - new Date(a.last_message_time));
            dataCache.chats = state.chats;
            dataCache.lastUpdate.chats = Date.now();
            if (state.page === 'chats') renderChatsPage();
            if (state.page === 'profile') renderProfilePage();
        } catch(e) { state.chats = []; }
    }

    function renderChatsPage() {
        document.getElementById('app').innerHTML = `
            <div class="app-container">
                <div class="header"><h2>💬 Чати</h2></div>
                <div id="chatsList">
                    ${state.chats.length === 0 ? '<div class="empty-state">💬 Немає чатів<br><br>Напишіть продавцю, щоб почати діалог</div>' :
                    state.chats.map(chat => {
                        const otherId = chat.buyer_id === state.user.id ? chat.seller_id : chat.buyer_id;
                        const otherName = chat.buyer_id === state.user.id ? 'Продавець' : 'Покупець';
                        return `
                            <div class="chat-card" onclick="openChatPage(${chat.id})">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div>
                                        <span style="font-weight:600; color:var(--text-primary);">👤 ${escapeHtml(otherName)}</span>
                                        <div style="font-size:13px; color:var(--text-secondary);">${escapeHtml(chat.last_message || 'Немає повідомлень')}</div>
                                    </div>
                                    <span style="font-size:11px; color:var(--text-dim);">${chat.last_message_time ? new Date(chat.last_message_time).toLocaleDateString() : ''}</span>
                                </div>
                                <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">📦 ${chat.goods?.title || 'Оголошення'}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
        setActiveNav('chats');
    }

    function openChatPage(chatId) {
        state.currentChat = chatId;
        apiRequest(`chats?id=eq.${chatId}&select=*,goods(title)`)
            .then(chatData => {
                const chat = chatData[0];
                if (!chat) { showMessage('❌ Чат не знайдено', true); return; }
                const otherId = chat.buyer_id === state.user.id ? chat.seller_id : chat.buyer_id;
                apiRequest(`users?id=eq.${otherId}&select=first_name`)
                    .then(users => {
                        const otherName = users[0]?.first_name || 'Користувач';
                        apiRequest(`messages?chat_id=eq.${chatId}&order=created_at.asc&limit=200`)
                            .then(messages => {
                                document.getElementById('app').innerHTML = `
                                    <div class="app-container">
                                        <div class="header">
                                            <button class="back-btn" onclick="goToChats()">←</button>
                                            <h2>💬 ${escapeHtml(otherName)}</h2>
                                        </div>
                                        <div style="display:flex; gap:8px; margin-bottom:8px;">
                                            <button class="jobs-tab active" onclick="setChatType('sale')">📦 Купівля</button>
                                            <button class="jobs-tab" onclick="setChatType('buy')">💰 Продаж</button>
                                        </div>
                                        <div style="font-size:12px; color:var(--text-secondary); padding:0 4px 8px;">📦 ${chat.goods?.title || 'Оголошення'}</div>
                                        <div class="chat-messages" id="chatMessages">
                                            ${messages.map(msg => `
                                                <div class="chat-message ${msg.sender_id === state.user.id ? 'own' : 'other'}">
                                                    ${escapeHtml(msg.text)}
                                                    <span class="chat-time">${new Date(msg.created_at).toLocaleTimeString()}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                        <div class="chat-input">
                                            <input type="text" id="chatInput" placeholder="Напишіть повідомлення..." onkeypress="if(event.keyCode==13) sendMessageToChat(${chatId})">
                                            <button onclick="sendMessageToChat(${chatId})">➤</button>
                                        </div>
                                    </div>
                                `;
                                setTimeout(() => { const c = document.getElementById('chatMessages'); if(c) c.scrollTop = c.scrollHeight; }, 100);
                            });
                    });
            });
    }

    function sendMessageToChat(chatId) {
        const input = document.getElementById('chatInput');
        const text = input?.value?.trim();
        if (!text) return;
        apiRequest('messages', { method: 'POST', body: JSON.stringify({ chat_id: chatId, sender_id: state.user.id, text: text }) })
            .then(() => {
                input.value = '';
                apiRequest(`chats?id=eq.${chatId}`, { method: 'PATCH', body: JSON.stringify({ last_message: text, last_message_time: new Date().toISOString() }) })
                    .then(() => { openChatPage(chatId); loadMyChats(); });
            });
    }

    function openChat(sellerId, adId) {
        if (!sellerId || !adId) { showMessage('❌ Помилка', true); return; }
        apiRequest(`chats?buyer_id=eq.${state.user.id}&seller_id=eq.${sellerId}&ad_id=eq.${adId}&select=*`)
            .then(chats => {
                if (chats && chats.length > 0) { openChatPage(chats[0].id); }
                else {
                    apiRequest('chats', { method: 'POST', body: JSON.stringify({ ad_id: adId, buyer_id: state.user.id, seller_id: sellerId }) })
                        .then(newChat => { if (newChat && newChat.length > 0) { openChatPage(newChat[0].id); } });
                }
            });
    }

    function goToChats() { state.page = 'chats'; renderChatsPage(); loadMyChats(); }

    // ========== RATING ==========
    function renderRating(userId, targetUserId, adId) {
        apiRequest(`ratings?from_user_id=eq.${userId}&to_user_id=eq.${targetUserId}&ad_id=eq.${adId}&select=*`)
            .then(existing => {
                const rated = existing && existing.length > 0;
                const current = rated ? existing[0].rating : 0;
                const container = document.getElementById('ratingContainer');
                if (!container) return;
                container.innerHTML = `
                    <div style="text-align:center; margin:12px 0;">
                        <div style="font-size:14px; color:var(--text-secondary); margin-bottom:6px;">${rated ? 'Ваша оцінка:' : 'Оцініть продавця:'}</div>
                        <div class="rating-stars" id="ratingStars">
                            ${[1,2,3,4,5].map(i => `<span class="star ${i <= current ? 'active' : ''}" data-value="${i}" onclick="setRating(${i}, '${userId}', '${targetUserId}', '${adId}')">★</span>`).join('')}
                        </div>
                        ${rated ? '<div style="font-size:12px; color:var(--text-dim);">Дякуємо за оцінку!</div>' : ''}
                    </div>
                `;
            });
    }

    function setRating(value, fromUserId, toUserId, adId) {
        apiRequest(`ratings?from_user_id=eq.${fromUserId}&to_user_id=eq.${toUserId}&ad_id=eq.${adId}&select=*`)
            .then(existing => {
                if (existing && existing.length > 0) {
                    apiRequest(`ratings?id=eq.${existing[0].id}`, { method: 'PATCH', body: JSON.stringify({ rating: value }) })
                        .then(() => { showMessage('⭐ Оцінку оновлено!'); renderRating(fromUserId, toUserId, adId); updateUserRating(toUserId); });
                } else {
                    apiRequest('ratings', { method: 'POST', body: JSON.stringify({ from_user_id: fromUserId, to_user_id: toUserId, ad_id: adId, rating: value }) })
                        .then(() => { showMessage('⭐ Дякуємо за оцінку!'); renderRating(fromUserId, toUserId, adId); updateUserRating(toUserId); });
                }
            });
    }

    function updateUserRating(userId) {
        apiRequest(`ratings?to_user_id=eq.${userId}&select=rating`)
            .then(ratings => {
                if (ratings && ratings.length > 0) {
                    const avg = ratings.reduce((s,r) => s + r.rating, 0) / ratings.length;
                    apiRequest(`users?id=eq.${userId}`, { method: 'PATCH', body: JSON.stringify({ rating: Math.round(avg * 10) / 10 }) })
                        .then(() => {});
                }
            });
    }

    // ========== AVATAR ==========
    function uploadAvatar() {
        const input = document.getElementById('avatarInput');
        const file = input?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64 = e.target.result;

        else if (type === 'job') item = state.jobs.find(j => j.id === id) || state.myJobs.find(j => j.id === id);
        else item = state.resumes.find(r => r.id === id) || state.myResumes.find(r => r.id === id);
        if (!item) { showMessage('Оголошення не знайдено', true); return; }
        if (type === 'goods' && item.id) trackView(item.id);

        const photos = getPhotosArray(item.photos);
        currentPhotos = photos;
        currentPhotoIndex = 0;

        let galleryHtml = '';
        if (type === 'goods') {
            if (photos.length === 0) galleryHtml = `<div class="detail-photo-container" style="display:flex; align-items:center; justify-content:center;">📷 Немає фото</div>`;
            else if (photos.length === 1) galleryHtml = `<div class="detail-photo-container" style="background-image:url('${photos[0]}'); background-size:cover; background-position:center; height:250px; border-radius:16px;"></div>`;

                        <div class="photo-arrow right" onclick="changePhoto(1)">›</div>

                    </div>
                `;
            }
        }

        document.getElementById('detailContent').innerHTML = `
            ${type === 'goods' ? galleryHtml : ''}
            <div class="detail-title">${escapeHtml(type === 'goods' ? item.title : type === 'job' ? item.title : item.specialty)}</div>
            <div class="detail-price">💰 ${escapeHtml(type === 'goods' ? item.price : type === 'job' ? item.salary : item.salary)} грн</div>

            <div class="detail-phone-box">📱 Телефон: ${escapeHtml(item.phone||'не вказано')}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="contact-seller" onclick="contactSeller('${escapeHtml(item.phone||'')}')" style="flex:1;">📞 Зателефонувати</button>
                <button class="contact-seller" style="flex:1; background:linear-gradient(135deg,#af52de,#7b2fbe);" onclick="openChat('${item.user_id}', '${item.id}')">💬 Написати</button>
            </div>
            ${type === 'goods' ? `
                <button class="favorite-btn ${state.favorites.find(f => f.ad_id === item.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite(${item.id})" style="font-size:28px; width:100%; margin-top:8px;">${state.favorites.find(f => f.ad_id === item.id) ? '❤️' : '🤍'}</button>

            setTimeout(() => {
                const c = document.getElementById('swipeContainer');
                if (c) {
                    let sx = 0;
                    c.addEventListener('touchstart', e => { sx = e.touches[0].clientX; });
                    c.addEventListener('touchend', e => {
                        const diff = e.changedTouches[0].clientX - sx;
                        if (Math.abs(diff) > 50) changePhoto(diff > 0 ? -1 : 1);
                    });
                    c.addEventListener('scroll', () => {
                        const ni = Math.round(c.scrollLeft / c.clientWidth);
                        if (ni !== currentPhotoIndex) { currentPhotoIndex = ni; updateDots(); }
                    });
                }
            }, 100);
        }
        setTimeout(() => enablePhotoZoom(), 100);

    function updateDots() {
        document.querySelectorAll('.photo-dot').forEach((dot, i) => {
            i === currentPhotoIndex ? dot.classList.add('active') : dot.classList.remove('active');
        });
    }
    window.changePhoto = function(dir) {
        if (!currentPhotos.length) return;
        currentPhotoIndex += dir;
        if (currentPhotoIndex < 0) currentPhotoIndex = currentPhotos.length - 1;
        if (currentPhotoIndex >= currentPhotos.length) currentPhotoIndex = 0;
        const c = document.getElementById('swipeContainer');
        if (c) c.scrollTo({ left: c.clientWidth * currentPhotoIndex, behavior: 'smooth' });
        updateDots();
    };
    window.goToPhoto = function(idx) {
        currentPhotoIndex = idx;
        const c = document.getElementById('swipeContainer');
        if (c) c.scrollTo({ left: c.clientWidth * currentPhotoIndex, behavior: 'smooth' });
        updateDots();
    };

    // ========== PHOTO ZOOM ==========
    function openFullScreenPhoto(photos, index) {
        window.currentPhotoIndex = index;
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a0f; z-index:100000; display:flex; align-items:center; justify-content:center; flex-direction:column; overflow:hidden;';
        const closeBtn = document.createElement('div');
        closeBtn.innerHTML = '✕';
        closeBtn.style.cssText = 'position:absolute; top:20px; right:20px; width:40px; height:40px; background:rgba(255,255,255,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; color:white; cursor:pointer; z-index:100002;';
        closeBtn.onclick = () => overlay.remove();
        const img = document.createElement('img');
        img.src = photos[index];
        img.style.cssText = 'max-width:90%; max-height:85%; object-fit:contain; transition:transform 0.1s ease;';
        let scale = 1;
        img.ondblclick = () => { scale = scale === 1 ? 2.5 : 1; img.style.transform = `scale(${scale})`; };
        let dist = 0, initialScale = 1;
        img.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                dist = Math.hypot(dx, dy);
                initialScale = scale;
            }
        });
        img.addEventListener('touchmove', e => {
            if (e.touches.length === 2 && dist > 0) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const nd = Math.hypot(dx, dy);
                let ns = initialScale * (nd / dist);
                ns = Math.min(Math.max(ns, 1), 4);
                scale = ns;
                img.style.transform = `scale(${scale})`;
            }
        });
        img.addEventListener('touchend', () => { dist = 0; });
        overlay.appendChild(closeBtn);
        overlay.appendChild(img);
        document.body.appendChild(overlay);
    }

    function enablePhotoZoom() {
        const container = document.querySelector('.photo-swipe-container');
        if (container) {
            const photos = Array.from(container.querySelectorAll('img')).map(img => img.src);
            container.querySelectorAll('img').forEach((img, idx) => {
                img.style.cursor = 'pointer';
                img.onclick = e => { e.stopPropagation(); openFullScreenPhoto(photos, idx); };
            });
        } else {
            const single = document.querySelector('.detail-photo-container img');
            if (single) {
                single.style.cursor = 'pointer';
                single.onclick = e => { e.stopPropagation(); openFullScreenPhoto([single.src], 0); };
            }
        }
    }

    // ========== INIT ==========
    function initProfileTabsScroll() {
        const c = document.querySelector('.profile-tabs');
        if (!c) return;
        let down = false, sx, sl;
        c.addEventListener('mousedown', e => { down = true; sx = e.pageX - c.offsetLeft; sl = c.scrollLeft; });
        c.addEventListener('mouseleave', () => { down = false; });
        c.addEventListener('mouseup', () => { down = false; });
        c.addEventListener('mousemove', e => { if (!down) return; e.preventDefault(); const x = e.pageX - c.offsetLeft; const walk = (x - sx) * 2; c.scrollLeft = sl - walk; });
        c.addEventListener('touchstart', e => { sx = e.touches[0].pageX - c.offsetLeft; sl = c.scrollLeft; }, { passive: true });
        c.addEventListener('touchmove', e => { const x = e.touches[0].pageX - c.offsetLeft; const walk = (x - sx) * 2; c.scrollLeft = sl - walk; });
    }

        document.querySelectorAll('.nav-item').forEach(btn => {

                else if (page === 'favorites') { state.page = 'favorites'; renderFavoritesPage(); loadFavorites(); }
                else if (page === 'create') { showAddModal(); }
                else if (page === 'chats') { state.page = 'chats'; renderChatsPage(); loadMyChats(); }
                else if (page === 'profile') { state.page = 'profile'; state.profileTab = 'active'; renderProfilePage(); loadMyGoods(true); loadMyJobs(true); loadMyResumes(true); loadMyChats(); loadNotifications(); }
                setTimeout(() => { isLoading = false; }, 150);
            });
        });
    }

    function initFloatingButton() {
        const fab = document.getElementById('fabButton');
        if (!fab) return;
        window.addEventListener('scroll', () => {
            if (isModalOpen) return;
            const st = window.pageYOffset || document.documentElement.scrollTop;
            if (st > lastScrollTop && st > 100) { fab.classList.add('hidden'); fab.classList.remove('visible'); }
            else { fab.classList.remove('hidden'); fab.classList.add('visible'); }
            lastScrollTop = st <= 0 ? 0 : st;
        });
        fab.classList.add('visible');
    }

    function closeKeyboard() {
        document.activeElement?.blur();
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            setTimeout(() => document.activeElement?.blur(), 50);
        }
    });
    document.addEventListener('click', function(e) {
        const target = e.target;
        if (target.closest('.nav-item') || target.closest('.category-item') || target.closest('.goods-card') || 
            target.closest('.fresh-card') || target.closest('.job-card') || target.closest('.resume-card') || 
            target.closest('.chat-card') || target.closest('.modal-btn') || target.closest('.btn-primary') ||
            target.closest('.btn-danger') || target.closest('.back-btn') || target.closest('.action-btn') ||
            target.closest('.contact-seller') || target.closest('.fab') || target.closest('.profile-tab') ||
            target.closest('.jobs-tab') || target.closest('.add-tab')) {
            setTimeout(() => document.activeElement?.blur(), 50);
        }
    });

    window.showAddModal = showAddModal;
    window.submitGoods = submitGoods;
    window.addPhotoInput = addPhotoInput;
    window.removePhoto = removePhoto;
    window.closeModal = closeModal;
    window.closeDetailModal = closeDetailModal;
    window.contactSeller = contactSeller;
    window.selectCategory = selectCategory;
    window.goToGoodsPage = goToGoodsPage;
    window.goToJobsPage = goToJobsPage;
    window.goBack = goBack;
    window.searchGoods = searchGoods;
    window.searchByCity = searchByCity;
    window.openDetail = openDetail;
    window.switchProfileTab = switchProfileTab;
    window.switchJobsTab = switchJobsTab;
    window.savePhone = savePhone;
    window.confirmDeleteToTrash = confirmDeleteToTrash;
    window.confirmDeletePermanent = confirmDeletePermanent;
    window.confirmArchive = confirmArchive;
    window.confirmRestore = confirmRestore;
    window.confirmDeleteJob = confirmDeleteJob;
    window.confirmDeleteResume = confirmDeleteResume;
    window.editGoods = editGoods;
    window.editJob = editJob;
    window.editResume = editResume;
    window.changePhoto = changePhoto;
    window.goToPhoto = goToPhoto;
    window.openChat = openChat;
    window.sendMessageToChat = sendMessageToChat;
    window.reportAd = reportAd;
    window.setRating = setRating;
    window.renderRating = renderRating;
    window.goToChats = goToChats;
    window.uploadAvatar = uploadAvatar;
    window.toggleFavorite = toggleFavorite;
    window.loadFavorites = loadFavorites;

    (async () => {
        console.log('🚀 UAMO 2.0 OLX');
        await loadUser();
        await loadGoods(true);
        await loadJobs(true);
        await loadResumes(true);
        await loadMyGoods(true);
        await loadMyJobs(true);
        await loadMyResumes(true);
        await loadMyChats();
        await loadNotifications();
        await loadFavorites();
        renderHomePage();
        initNavigation();
        initFloatingButton();
        setTimeout(initProfileTabsScroll, 100);
        const splash = document.getElementById('splash');
        if (splash) splash.remove();
    })();
</script>
</body>
</html>
