    // ================================================================
    // ІНІЦІАЛІЗАЦІЯ SUPABASE - ВИПРАВЛЕНО

    function initSupabase() {
        try {
            // ВИКОРИСТОВУЄМО window.supabase замість supabaseClient
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase client initialized successfully');
                const badge = document.getElementById('statusBadge');
                if (badge) {
                    badge.textContent = '✅';
                    badge.className = 'status-badge status-connected';
                }
                return true;
            } else {
                console.error('❌ Supabase SDK not loaded. Check script tag.');

                if (badge) {
                    badge.textContent = '❌';
                    badge.className = 'status-badge status-error';
                }
                return false;
            }
        } catch (e) {
            console.error('❌ Failed to init Supabase:', e);
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.textContent = '❌';
                badge.className = 'status-badge status-error';
            }
            return false;
        }
    }

    // ================================================================
    // ПЕРЕВІРКА ЗАВАНТАЖЕННЯ SUPABASE
    // ================================================================
    function waitForSupabase(callback, attempts) {
        attempts = attempts || 0;
        if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
            console.log('✅ Supabase SDK loaded!');
            if (initSupabase()) {
                callback();
            }
        } else if (attempts < 20) {
            console.log(`⏳ Waiting for Supabase SDK... attempt ${attempts + 1}/20`);
            setTimeout(function() {
                waitForSupabase(callback, attempts + 1);
            }, 300);
        } else {
            console.error('❌ Failed to load Supabase SDK');
            const badge = document.getElementById('statusBadge');
            if (badge) {
                badge.textContent = '❌';
                badge.className = 'status-badge status-error';
            }
            showAuthError('Не вдалося завантажити бібліотеку Supabase. Перевірте з\'єднання.');
        }
    }

    // ================================================================

    function showAuthError(message) {
        const el = document.getElementById('authError');
        if (!el) return;
        el.textContent = message;
        el.className = 'auth-error show';
        const success = document.getElementById('authSuccess');
        if (success) success.className = 'auth-success';
    }

    function showAuthSuccess(message) {
        const el = document.getElementById('authSuccess');
        if (!el) return;
        el.textContent = message;
        el.className = 'auth-success show';
        const error = document.getElementById('authError');
        if (error) error.className = 'auth-error';
    }

    function hideAuthMessages() {
        const error = document.getElementById('authError');
        const success = document.getElementById('authSuccess');
        if (error) error.className = 'auth-error';
        if (success) success.className = 'auth-success';
    }

    function setLoading(loading) {
        const btn = document.getElementById('authSubmitBtn');
        const el = document.getElementById('authLoading');
        const inputs = document.querySelectorAll('#authForm input');

        if (loading) {
            if (btn) { btn.disabled = true;
                btn.textContent = '⏳ Завантаження...'; }
            if (el) el.className = 'auth-loading show';
            inputs.forEach(i => i.disabled = true);
        } else {
            if (btn) { btn.disabled = false;
                btn.textContent = isAuthMode === 'login' ? 'Увійти' : 'Зареєструватися'; }
            if (el) el.className = 'auth-loading';
            inputs.forEach(i => i.disabled = false);
        }
    }

    // ================================================================
    // TOGGLE AUTH MODE
    // ================================================================
    function toggleAuthMode() {
        hideAuthMessages();
        isAuthMode = isAuthMode === 'login' ? 'register' : 'login';

        const btn = document.getElementById('authSubmitBtn');
        const toggleText = document.getElementById('authToggleText');
        const link = document.getElementById('authToggleLink');
        const subtitle = document.getElementById('authSubtitle');
        const confirmGroup = document.getElementById('confirmPasswordGroup');
        const forgotLink = document.getElementById('forgotPasswordLink');
        const passwordInput = document.getElementById('authPassword');

        if (isAuthMode === 'login') {
            if (btn) btn.textContent = 'Увійти';
            if (toggleText) toggleText.textContent = 'Немає акаунта?';
            if (link) link.textContent = 'Зареєструватися';
            if (subtitle) subtitle.textContent = 'Увійдіть у свій акаунт';
            if (confirmGroup) confirmGroup.classList.add('hidden');
            if (forgotLink) forgotLink.classList.remove('hidden');
            if (passwordInput) { passwordInput.placeholder = '••••••••';
                passwordInput.autocomplete = 'current-password'; }
        } else {
            if (btn) btn.textContent = 'Зареєструватися';
            if (toggleText) toggleText.textContent = 'Вже маєте акаунт?';
            if (link) link.textContent = 'Увійти';
            if (subtitle) subtitle.textContent = 'Створіть новий акаунт';
            if (confirmGroup) confirmGroup.classList.remove('hidden');
            if (forgotLink) forgotLink.classList.add('hidden');
            if (passwordInput) { passwordInput.placeholder = '•••••••• (мін. 6 символів)';
                passwordInput.autocomplete = 'new-password'; }
        }
    }

    // ================================================================
    // AUTH HANDLERS
    // ================================================================
    async function handleAuth() {
        hideAuthMessages();

        if (!supabase) {
            showAuthError('Підключення до сервера не встановлено. Спробуйте перезавантажити сторінку.');
            return;
        }

        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value;
        const confirmPassword = document.getElementById('authConfirmPassword')?.value;

        if (!email) {
            showAuthError('Введіть email');
            document.getElementById('authEmail').focus();
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            showAuthError('Введіть коректний email');
            document.getElementById('authEmail').focus();
            return;
        }

        if (!password) {
            showAuthError('Введіть пароль');
            document.getElementById('authPassword').focus();
            return;
        }

        if (password.length < 6) {
            showAuthError('Пароль має бути не менше 6 символів');
            document.getElementById('authPassword').focus();
            return;
        }

        if (isAuthMode === 'register') {
            if (!confirmPassword) {
                showAuthError('Підтвердіть пароль');
                document.getElementById('authConfirmPassword').focus();
                return;
            }
            if (password !== confirmPassword) {
                showAuthError('Паролі не співпадають');
                document.getElementById('authConfirmPassword').focus();
                return;
            }
        }

        setLoading(true);

        try {
            if (isAuthMode === 'login') {
                console.log('🔐 Attempting login for:', email);

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                setLoading(false);

                if (error) {
                    console.error('❌ Login error:', error);
                    if (error.message.includes('Invalid login credentials')) {
                        showAuthError('Невірний email або пароль');
                    } else if (error.message.includes('Email not confirmed')) {
                        showAuthError('Email не підтверджено. Перевірте вашу пошту та підтвердіть акаунт.');
                    } else if (error.message.includes('network') || error.message.includes('fetch')) {
                        showAuthError('Помилка з\'єднання з сервером. Перевірте інтернет.');
                    } else {
                        showAuthError(`Помилка: ${error.message}`);
                    }
                    return;
                }

                if (data?.user) {
                    console.log('✅ Login successful:', data.user.email);
                    currentUser = data.user;
                    showAuthSuccess('✅ Вхід виконано успішно!');

                    await loadUserData();
                    await loadListings();
                    await loadFavorites();
                    await loadChats();

                    setTimeout(() => {
                        navigateTo('home');
                    }, 500);
                }

            } else {
                console.log('📝 Attempting registration for:', email);

                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            first_name: email.split('@')[0],
                            username: email.split('@')[0],
                            city: 'Київ'
                        },
                        emailRedirectTo: window.location.origin + '/'
                    }
                });

                setLoading(false);

                if (error) {
                    console.error('❌ Registration error:', error);
                    if (error.message.includes('User already registered')) {
                        showAuthError('Цей email вже зареєстровано. Увійдіть у свій акаунт.');
                    } else if (error.message.includes('network') || error.message.includes('fetch')) {
                        showAuthError('Помилка з\'єднання з сервером. Перевірте інтернет.');
                    } else {
                        showAuthError(`Помилка: ${error.message}`);
                    }
                    return;
                }

                if (data?.user) {
                    console.log('✅ Registration successful:', data.user.email);

                    try {
                        await createUserRecord(data.user.id, email, email.split('@')[0]);
                    } catch (e) {
                        console.warn('⚠️ User record creation warning:', e);
                    }

                    if (data.user.confirmed_at) {
                        showAuthSuccess('✅ Реєстрація успішна! Ви можете увійти.');
                        setTimeout(() => {
                            toggleAuthMode();
                            document.getElementById('authEmail').value = email;
                            document.getElementById('authPassword').value = '';
                            showAuthSuccess('Тепер увійдіть у свій акаунт');
                        }, 1500);
                    } else {
                        showAuthSuccess('✅ Реєстрація успішна! Перевірте вашу пошту для підтвердження акаунта.');
                    }
                }
            }
        } catch (e) {
            setLoading(false);
            console.error('❌ Unexpected auth error:', e);
            showAuthError('Несподівана помилка. Спробуйте ще раз або перезавантажте сторінку.');
        }
    }

    // ================================================================
    // FORGOT PASSWORD
    // ================================================================
    async function handleForgotPassword() {
        if (!supabase) {
            showAuthError('Підключення до сервера не встановлено');
            return;
        }

        const email = document.getElementById('authEmail').value.trim();

        if (!email) {
            showAuthError('Введіть email для відновлення пароля');
            document.getElementById('authEmail').focus();
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            showAuthError('Введіть коректний email');
            document.getElementById('authEmail').focus();
            return;
        }

        hideAuthMessages();
        setLoading(true);

        try {
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/'
            });

            setLoading(false);

            if (error) {
                console.error('❌ Reset password error:', error);
                if (error.message.includes('User not found')) {
                    showAuthError('Користувача з таким email не знайдено');
                } else {
                    showAuthError(`Помилка: ${error.message}`);
                }
                return;
            }

            showAuthSuccess(`✅ Лист з посиланням для відновлення надіслано на ${email}`);
            document.getElementById('authPassword').value = '';
            if (document.getElementById('authConfirmPassword')) {
                document.getElementById('authConfirmPassword').value = '';
            }
        } catch (e) {
            setLoading(false);
            console.error('❌ Unexpected reset error:', e);
            showAuthError('Помилка. Спробуйте ще раз.');
        }
    }

    // ================================================================
    // USER RECORD HELPER
    // ================================================================
    async function createUserRecord(userId, email, username) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id: userId,
                    email: email,
                    first_name: username,
                    username: username,
                    city: 'Київ',
                    created_at: new Date().toISOString()
                })
            });

            if (!response.ok) {
                console.warn('⚠️ User record creation failed:', response.status);
            } else {
                console.log('✅ User record created');
            }
        } catch (e) {
            console.warn('⚠️ User record creation error:', e);
        }
    }

    // ================================================================
    // API REQUEST HELPER
    // ================================================================
    async function apiRequest(endpoint, options = {}) {
        try {
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                ...options.headers
            };

            const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
                ...options,
                headers: headers
            });

            if (res.status === 204) return [];
            if (res.status === 404) {
                console.warn(`⚠️ Endpoint not found: ${endpoint}`);
                return [];
            }
            if (res.status === 401 || res.status === 403) {
                console.warn('⚠️ Unauthorized request');
                return [];
            }
            if (res.status === 201 || res.status === 200) {
                const text = await res.text();
                if (text && text.length > 0) {
                    try { return JSON.parse(text); } catch (e) { return []; }
                }
                return [];
            }
            if (!res.ok) {
                console.warn(`⚠️ API error ${res.status}: ${endpoint}`);
                return [];
            }
            const text = await res.text();
            if (text && text.length > 0) {
                try { return JSON.parse(text); } catch (e) { return []; }
            }
            return [];
        } catch (e) {
            console.error('Fetch error:', e);
            return [];
        }
    }

    // ================================================================

    // ================================================================
    async function loadUserData() {
        if (!currentUser) return;
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${currentUser.id}&select=*`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                if (data && data.length > 0) {
                    const u = data[0];
                    userData.id = u.id;
                    userData.name = u.first_name || 'Користувач';
                    userData.last_name = u.last_name || '';
                    userData.username = u.username || '';
                    userData.phone = u.phone || '';
                    userData.email = u.email || currentUser.email || '';
                    userData.city = u.city || 'Київ';
                    userData.avatar = u.avatar_url || userData.avatar;
                    userData.language = u.language || 'uk';
                    updateUI();
                    console.log('✅ User data loaded');
                }
            }
        } catch (e) {
            console.warn('⚠️ Failed to load user data:', e);
        }
    }

    // ================================================================
    // RENDER HELPERS
    // ================================================================
    function timeAgo(dateStr) {
        if (!dateStr) return 'нещодавно';
        const diff = Date.now() - new Date(dateStr).getTime();
        const min = Math.floor(diff / 60000);
        if (min < 1) return 'щойно';
        if (min < 60) return `${min} хв тому`;
        const hrs = Math.floor(min / 60);
        if (hrs < 24) return `${hrs} год тому`;
        const days = Math.floor(hrs / 24);
        if (days < 7) return `${days} дн тому`;
        return new Date(dateStr).toLocaleDateString();
    }

    function updateChatBadge() {
        const badge = document.getElementById('chatBadge');
        if (!badge) return;
        const count = chats.reduce((sum, c) => sum + (c.unread_count || 0), 0);
        unreadCount = count;

            badge.textContent = count > 9 ? '9+' : count;

            badge.style.display = 'none';

            results = results.filter(l =>

    // ================================================================
    // NAVIGATION
    // ================================================================
    function navigateTo(page) {
        if (page === 'auth') {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-auth');
            if (target) target.classList.add('active');
            const bottomNav = document.getElementById('bottomNav');
            if (bottomNav) bottomNav.classList.remove('show');
            currentPage = 'auth';
            return;
        }

        if (!currentUser && page !== 'auth') {
            navigateTo('auth');
            return;
        }

        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(`page-${page}`);
        if (target) target.classList.add('active');
        const bottomNav = document.getElementById('bottomNav');
        if (bottomNav) bottomNav.classList.add('show');
        currentPage = page;

        if (historyStack[historyStack.length - 1] !== page) {
            historyStack.push(page);
        }

        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBack() {
        if (historyStack.length > 1) {
            historyStack.pop();
            const prev = historyStack[historyStack.length - 1];
            navigateTo(prev);
        } else {
            navigateTo('home');
        }
    }

    function updateNav(page) {
        document.querySelectorAll('.bottom-nav-item').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.page === page);
        });
    }

    function goBackFromDetail() {
        if (currentPage === 'detail') {
            navigateTo('home');
        }
    }

    // ================================================================
    // LISTING OPERATIONS
    // ================================================================
    async function toggleFavorite(listingId) {
        if (!currentUser) { navigateTo('auth'); return; }
        const isFav = favorites.includes(listingId);
        if (isFav) {
            await apiRequest(`favorites?user_id=eq.${currentUser.id}&listing_id=eq.${listingId}`, { method: 'DELETE' });
            favorites = favorites.filter(id => id !== listingId);
        } else {
            await apiRequest('favorites', {
                method: 'POST',
                body: JSON.stringify({ user_id: currentUser.id, listing_id: listingId })
            });
            favorites.push(listingId);
        }
        renderAll();
        updateProfileStats();
    }

    async function submitListing() {
        if (!currentUser) { navigateTo('auth'); return; }

        const title = document.getElementById('addTitle').value.trim();
        const price = document.getElementById('addPrice').value.trim();
        const city = document.getElementById('addCity').value.trim() || userData.city;
        const phone = document.getElementById('addPhone').value.trim() || userData.phone;
        const desc = document.getElementById('addDesc').value.trim();
        const category = document.getElementById('addCategory').value;

        if (!title) { alert('Введіть назву'); return; }
        if (!price) { alert('Введіть ціну'); return; }

        const newItem = {
            user_id: currentUser.id,
            title: title,
            price: parseFloat(price),
            city: city,
            phone: phone,
            description: desc || '',
            category: category,
            photos: selectedPhotos.length > 0 ? selectedPhotos : null,
            status: 'active',
            created_at: new Date().toISOString()
        };

        const result = await apiRequest('listings', {
            method: 'POST',
            body: JSON.stringify(newItem)
        });

        selectedPhotos = [];
        renderPhotoPreviews();
        document.getElementById('addTitle').value = '';
        document.getElementById('addPrice').value = '';
        document.getElementById('addCity').value = '';
        document.getElementById('addPhone').value = '';
        document.getElementById('addDesc').value = '';

        showSuccessModal(
            '✓ Оголошення опубліковано!',
            'Ваше оголошення вже доступне на UAMO.',
            () => navigateTo('home'),
            () => { if (result && result.length > 0) openDetail(result[0].id);
                else navigateTo('home'); }
        );

        await loadListings();
        await loadMyListings();
    }

    function showSuccessModal(title, message, primaryAction, secondaryAction) {
        const modal = document.getElementById('successModal');
        if (!modal) return;
        document.getElementById('successTitle').textContent = title;
        document.getElementById('successMessage').textContent = message;

        const primaryBtn = document.getElementById('successPrimaryBtn');
        const secondaryBtn = document.getElementById('successSecondaryBtn');

        if (primaryBtn) {
            primaryBtn.onclick = () => {
                closeSuccessModal();
                if (primaryAction) primaryAction();
            };
        }
        if (secondaryBtn) {
            secondaryBtn.onclick = () => {
                closeSuccessModal();
                if (secondaryAction) secondaryAction();
            };
        }

        modal.classList.add('show');
    }

    function closeSuccessModal() {
        const modal = document.getElementById('successModal');
        if (modal) modal.classList.remove('show');
    }

    // ================================================================
    // DETAIL
    // ================================================================
    function openDetail(id) {
        const listing = listings.find(l => l.id === id);
        if (!listing) { alert('Оголошення не знайдено'); return; }
        currentDetailListing = listing;
        currentDetailId = id;
        detailPhotos = listing.photos || (listing.image ? [listing.image] : []);
        detailIndex = 0;

        const priceEl = document.getElementById('detailPrice');
        const titleEl = document.getElementById('detailTitle');
        const metaEl = document.getElementById('detailMeta');
        const descEl = document.getElementById('detailDesc');
        const specsContainer = document.getElementById('detailSpecs');
        const gallery = document.getElementById('detailGallery');

        if (priceEl) priceEl.textContent = `${listing.price} грн`;
        if (titleEl) titleEl.textContent = listing.title;
        if (metaEl) {
            metaEl.innerHTML = `
                <span><i class="fas fa-map-marker-alt"></i> ${listing.location}</span>
                <span><i class="far fa-clock"></i> ${timeAgo(listing.createdAt)}</span>
            `;
        }
        if (descEl) descEl.textContent = listing.description || 'Без опису';

        if (specsContainer) {
            if (listing.specs && Object.keys(listing.specs).length > 0) {
                specsContainer.innerHTML = Object.entries(listing.specs)
                    .map(([key, val]) => `<div class="spec-item"><span class="label">${key}</span> <span>${val}</span></div>`)
                    .join('');
                specsContainer.style.display = 'grid';
            } else {
                specsContainer.style.display = 'none';
            }
        }

        // Update gallery
        if (gallery) {
            if (detailPhotos.length > 0) {
                gallery.style.backgroundImage = `url('${detailPhotos[0]}')`;
                gallery.style.backgroundSize = 'cover';
                gallery.style.backgroundPosition = 'center';
                gallery.innerHTML = `
                    <button class="nav-arrow left" id="detailArrowLeft" onclick="changeDetailPhoto(-1)">‹</button>
                    <button class="nav-arrow right" id="detailArrowRight" onclick="changeDetailPhoto(1)">›</button>
                    <div class="dots" id="detailDots"></div>
                `;
                renderDetailDots();
            } else {
                gallery.innerHTML = `<i class="fas fa-image"></i>`;
            }
        }

        // Update seller
        const sellerAvatar = document.getElementById('sellerAvatar');
        const sellerName = document.getElementById('sellerName');
        const sellerSince = document.getElementById('sellerSince');
        const sellerCallBtn = document.getElementById('sellerCallBtn');

        if (sellerAvatar) sellerAvatar.textContent = listing.seller?.avatar || '👤';
        if (sellerName) sellerName.textContent = listing.seller?.name || 'Продавець';
        if (sellerSince) sellerSince.textContent = listing.seller?.since || 'На UAMO з 2024';

        // Check if own listing
        const isOwn = listing.user_id === currentUser?.id;
        const chatBtn = document.querySelector('.btn-submit[onclick*="openChatFromDetail"]');
        if (chatBtn) {
            if (isOwn) {
                chatBtn.textContent = '✏️ Редагувати';
                chatBtn.onclick = () => editListing(listing.id);
            } else {
                chatBtn.textContent = '💬 Написати продавцю';
                chatBtn.onclick = openChatFromDetail;
            }
        }

        if (sellerCallBtn) {
            sellerCallBtn.onclick = () => {
                const phone = listing.phone || userData.phone;
                if (phone) {
                    window.location.href = `tel:${phone}`;
                } else {
                    alert('Номер телефону не вказано');
                }
            };
        }

        // Update favorite button
        updateDetailFavoriteBtn();

        navigateTo('detail');
    }

    function renderDetailDots() {
        const dotsContainer = document.getElementById('detailDots');
        if (!dotsContainer) return;
        if (detailPhotos.length <= 1) {
            dotsContainer.innerHTML = '';
            return;
        }
        dotsContainer.innerHTML = detailPhotos.map((_, i) =>
            `<span class="${i === detailIndex ? 'active' : ''}" onclick="changeDetailPhoto(${i - detailIndex})"></span>`
        ).join('');
    }

    function changeDetailPhoto(direction) {
        if (detailPhotos.length === 0) return;
        detailIndex = (detailIndex + direction + detailPhotos.length) % detailPhotos.length;
        const gallery = document.getElementById('detailGallery');
        if (gallery) {
            gallery.style.backgroundImage = `url('${detailPhotos[detailIndex]}')`;
        }
        renderDetailDots();

        // Update arrows visibility
        const leftArrow = document.getElementById('detailArrowLeft');
        const rightArrow = document.getElementById('detailArrowRight');
        if (leftArrow && rightArrow) {
            if (detailPhotos.length <= 1) {
                leftArrow.style.display = 'none';
                rightArrow.style.display = 'none';
            } else {
                leftArrow.style.display = 'block';
                rightArrow.style.display = 'block';
            }
        }
    }

    function updateDetailFavoriteBtn() {
        const btn = document.getElementById('detailFavoriteBtn');
        if (!btn) return;
        if (currentDetailId && isFavorite(currentDetailId)) {
            btn.className = 'fas fa-heart';
            btn.style.color = '#EF4444';
        } else {
            btn.className = 'far fa-heart';
            btn.style.color = 'var(--text-secondary)';
        }
    }

    function toggleDetailFavorite() {
        if (!currentDetailId) return;
        toggleFavorite(currentDetailId);
        updateDetailFavoriteBtn();
        renderAll();
    }

    function openChatFromDetail() {
        if (!currentUser) { navigateTo('auth'); return; }
        if (!currentDetailListing) return;
        const sellerId = currentDetailListing.user_id;
        if (sellerId === currentUser.id) {
            editListing(currentDetailId);
            return;
        }
        // Find or create chat
        const existingChat = chats.find(c =>
            (c.buyer_id === currentUser.id && c.seller_id === sellerId) ||
            (c.buyer_id === sellerId && c.seller_id === currentUser.id)
        );
        if (existingChat) {
            openChatDetail(existingChat.id);
        } else {
            createChat(sellerId, currentDetailListing.id);
        }
    }

    // ================================================================
    // CHAT FUNCTIONS
    // ================================================================
    async function createChat(sellerId, listingId) {
        if (!currentUser) return;
        try {
            const result = await apiRequest('chats', {
                method: 'POST',
                body: JSON.stringify({
                    buyer_id: currentUser.id,
                    seller_id: sellerId,
                    listing_id: listingId,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                })
            });
            if (result && result.length > 0) {
                await loadChats();
                openChatDetail(result[0].id);
            }
        } catch (e) {
            console.error('❌ Error creating chat:', e);
            alert('Помилка створення чату');
        }
    }

    async function openChatDetail(chatId) {
        currentChatId = chatId;
        // Load messages
        const messages = await apiRequest(`messages?chat_id=eq.${chatId}&order=created_at.asc`);
        chatMessages = messages || [];

        const container = document.getElementById('chatMessages');
        if (!container) return;

        if (chatMessages.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding:20px;">Немає повідомлень</div>';
        } else {
            container.innerHTML = chatMessages.map(msg => {
                const isOwn = msg.sender_id === currentUser.id;
                return `
                    <div class="chat-message ${isOwn ? 'own' : 'other'}">
                        ${msg.content}
                        <span class="chat-time">${timeAgo(msg.created_at)}</span>
                    </div>
                `;
            }).join('');
        }

        // Update chat partner info
        const chat = chats.find(c => c.id === chatId);
        if (chat) {
            const isBuyer = chat.buyer_id === currentUser.id;
            const partner = isBuyer ? chat.seller : chat.buyer;
            const partnerName = partner?.first_name || 'Користувач';
            const partnerAvatar = partner?.avatar_url || partnerName?.[0] || '👤';
            document.getElementById('chatPartnerName').textContent = partnerName;
            document.getElementById('chatPartnerAvatar').textContent = partnerAvatar;
        }

        navigateTo('chat-detail');
        scrollChatToBottom();

        // Mark as read
        await markChatRead(chatId);
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        if (!input) return;
        const content = input.value.trim();
        if (!content || !currentChatId || !currentUser) return;

        try {
            const result = await apiRequest('messages', {
                method: 'POST',
                body: JSON.stringify({
                    chat_id: currentChatId,
                    sender_id: currentUser.id,
                    content: content,
                    created_at: new Date().toISOString()
                })
            });

            if (result && result.length > 0) {
                // Update chat last message
                await apiRequest(`chats?id=eq.${currentChatId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        last_message: content,
                        last_message_time: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    })
                });

                input.value = '';
                await loadChats();
                await openChatDetail(currentChatId);
            }
        } catch (e) {
            console.error('❌ Error sending message:', e);
            alert('Помилка відправки повідомлення');
        }
    }

    async function markChatRead(chatId) {
        try {
            await apiRequest(`chats?id=eq.${chatId}`, {
                method: 'PATCH',
                body: JSON.stringify({ unread_count: 0 })
            });
            await loadChats();
        } catch (e) {
            console.warn('⚠️ Failed to mark chat read:', e);
        }
    }

    function scrollChatToBottom() {
        const container = document.getElementById('chatMessages');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    }

    // ================================================================
    // PHOTO HANDLING
    // ================================================================
    function handlePhotos(event) {
        const files = event.target.files;
        if (!files) return;
        for (let i = 0; i < files.length && selectedPhotos.length < 8; i++) {
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedPhotos.push(e.target.result);
                renderPhotoPreviews();
            };
            reader.readAsDataURL(files[i]);
        }
        event.target.value = '';
    }

    function renderPhotoPreviews() {
        const grid = document.getElementById('photoPreviewGrid');
        if (!grid) return;
        grid.innerHTML = selectedPhotos.map((photo, index) =>
            `<div class="photo-preview-item" style="background-image:url('${photo}');">
                <button class="remove-photo" onclick="removePhoto(${index})">×</button>
            </div>`
        ).join('');
    }

    function removePhoto(index) {
        selectedPhotos.splice(index, 1);
        renderPhotoPreviews();
    }

    // ================================================================
    // EDIT LISTING
    // ================================================================
    function editListing(id) {
        const listing = myListings.find(l => l.id === id) || listings.find(l => l.id === id);
        if (!listing) { alert('Оголошення не знайдено'); return; }

        document.getElementById('addTitle').value = listing.title || '';
        document.getElementById('addPrice').value = listing.price || '';
        document.getElementById('addCity').value = listing.location || '';
        document.getElementById('addPhone').value = listing.phone || '';
        document.getElementById('addDesc').value = listing.description || '';
        selectedPhotos = listing.photos || [];
        renderPhotoPreviews();

        navigateTo('add');
        // Change button text
        const btn = document.querySelector('.btn-submit');
        if (btn) {
            btn.textContent = '💾 Оновити оголошення';
            btn.onclick = () => updateListing(id);
        }
    }

    async function updateListing(id) {
        const title = document.getElementById('addTitle').value.trim();
        const price = document.getElementById('addPrice').value.trim();
        const city = document.getElementById('addCity').value.trim() || userData.city;
        const phone = document.getElementById('addPhone').value.trim() || userData.phone;
        const desc = document.getElementById('addDesc').value.trim();
        const category = document.getElementById('addCategory').value;

        if (!title) { alert('Введіть назву'); return; }
        if (!price) { alert('Введіть ціну'); return; }

        try {
            await apiRequest(`listings?id=eq.${id}`, {
                method: 'PATCH',
                body: JSON.stringify({
                    title: title,
                    price: parseFloat(price),
                    city: city,
                    phone: phone,
                    description: desc || '',
                    category: category,
                    photos: selectedPhotos.length > 0 ? selectedPhotos : null,
                    updated_at: new Date().toISOString()
                })
            });

            alert('✅ Оголошення оновлено!');
            await loadListings();
            await loadMyListings();
            navigateTo('my-listings');
        } catch (e) {
            console.error('❌ Error updating listing:', e);
            alert('Помилка оновлення');
        }
    }

    async function deleteListing(id) {
        if (!confirm('Ви впевнені, що хочете видалити це оголошення?')) return;

        try {
            await apiRequest(`listings?id=eq.${id}`, { method: 'DELETE' });
            alert('🗑 Оголошення видалено');
            await loadListings();
            await loadMyListings();
            if (currentPage === 'my-listings') renderMyListings();
        } catch (e) {
            console.error('❌ Error deleting listing:', e);
            alert('Помилка видалення');
        }
    }

    // ================================================================
    // PROFILE FUNCTIONS
    // ================================================================
    async function saveProfile() {
        if (!currentUser) { navigateTo('auth'); return; }

        const name = document.getElementById('editName').value.trim() || 'Користувач';
        const lastName = document.getElementById('editLastName').value.trim() || '';
        const username = document.getElementById('editUsername').value.trim() || '';
        const phone = document.getElementById('editPhone').value.trim() || '';
        const city = document.getElementById('editCity').value || 'Київ';

        try {
            await apiRequest(`users?id=eq.${currentUser.id}`, {
                method: 'PATCH',
                body: JSON.stringify({
                    first_name: name,
                    last_name: lastName,
                    username: username,
                    phone: phone,
                    city: city,
                    updated_at: new Date().toISOString()
                })
            });

            userData.name = name;
            userData.last_name = lastName;
            userData.username = username;
            userData.phone = phone;
            userData.city = city;
            updateUI();
            alert('✅ Профіль оновлено!');
            navigateTo('profile');
        } catch (e) {
            console.error('❌ Error saving profile:', e);
            alert('Помилка збереження');
        }
    }

    function uploadAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const avatarUrl = e.target.result;
            userData.avatar = avatarUrl;
            updateUI();
            // Save to server
            apiRequest(`users?id=eq.${currentUser.id}`, {
                method: 'PATCH',
                body: JSON.stringify({ avatar_url: avatarUrl })
            });
        };
        reader.readAsDataURL(file);
    }

    function editUploadAvatar(event) {
        uploadAvatar(event);
    }

    // ================================================================
    // SETTINGS FUNCTIONS
    // ================================================================
    function toggleSetting(el) {
        el.classList.toggle('active');
    }

    function selectCity(city) {
        userData.city = city;
        apiRequest(`users?id=eq.${currentUser.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ city: city })
        });
        renderCities();
        updateUI();
        alert(`✅ Місто змінено на ${city}`);
    }

    function filterCities(query) {
        const container = document.getElementById('citiesList');
        if (!container) return;
        const filtered = cities.filter(c =>
            c.toLowerCase().includes(query.toLowerCase())
        );
        container.innerHTML = filtered.map(c =>
            `<div class="settings-item" onclick="selectCity('${c}')" style="cursor:pointer;">
                <span class="settings-label">${c}</span>
                ${c === userData.city ? '<span style="color:var(--accent);"><i class="fas fa-check-circle"></i></span>' : ''}
            </div>`
        ).join('');
    }

    function saveLanguage() {
        const selected = document.querySelector('input[name="language"]:checked');
        if (!selected) return;
        const lang = selected.value;
        userData.language = lang;
        apiRequest(`users?id=eq.${currentUser.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ language: lang })
        });
        alert(`✅ Мову змінено на ${selected.parentElement.textContent.trim()}`);
    }

    // ================================================================
    // CHANGE PASSWORD / EMAIL / PHONE
    // ================================================================
    async function changePassword() {
        if (!supabase) { alert('Підключення до сервера не встановлено'); return; }

        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!currentPassword || !newPassword || !confirmPassword) {
            alert('Заповніть всі поля');
            return;
        }
        if (newPassword.length < 6) {
            alert('Новий пароль має бути не менше 6 символів');
            return;
        }
        if (newPassword !== confirmPassword) {
            alert('Паролі не співпадають');
            return;
        }

        try {
            const { error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) throw error;

            alert('✅ Пароль змінено успішно!');
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } catch (e) {
            console.error('❌ Error changing password:', e);
            alert('Помилка зміни пароля: ' + e.message);
        }
    }

    async function changeEmail() {
        if (!supabase) { alert('Підключення до сервера не встановлено'); return; }

        const newEmail = document.getElementById('newEmail').value.trim();
        if (!newEmail || !newEmail.includes('@')) {
            alert('Введіть коректний email');
            return;
        }

        try {
            const { error } = await supabase.auth.updateUser({
                email: newEmail
            });

            if (error) throw error;

            alert('✅ Email змінено! Перевірте нову пошту для підтвердження.');
            userData.email = newEmail;
            updateUI();
        } catch (e) {
            console.error('❌ Error changing email:', e);
            alert('Помилка зміни email: ' + e.message);
        }
    }

    async function changePhone() {
        if (!supabase) { alert('Підключення до сервера не встановлено'); return; }

        const newPhone = document.getElementById('newPhone').value.trim();
        if (!newPhone) {
            alert('Введіть номер телефону');
            return;
        }

        try {
            const { error } = await supabase.auth.updateUser({
                data: { phone: newPhone }
            });

            if (error) throw error;

            alert('✅ Телефон змінено успішно!');
            userData.phone = newPhone;
            updateUI();
        } catch (e) {
            console.error('❌ Error changing phone:', e);
            alert('Помилка зміни телефону: ' + e.message);
        }
    }

    async function handleLogout() {
        if (!confirm('Ви впевнені, що хочете вийти?')) return;

        try {
            if (supabase) {
                await supabase.auth.signOut();
            }
            currentUser = null;
            currentPage = 'auth';
            navigateTo('auth');
            const bottomNav = document.getElementById('bottomNav');
            if (bottomNav) bottomNav.classList.remove('show');
        } catch (e) {
            console.error('❌ Error logging out:', e);
        }
    }

    // ================================================================
    // TELEGRAM WEBAPP SUPPORT
    // ================================================================
    function initTelegramWebApp() {
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                tg.ready();
                console.log('✅ Telegram WebApp initialized');
            }
        } catch (e) {
            console.warn('⚠️ Telegram WebApp not available');
        }
    }

    // ================================================================
    // INITIALIZATION
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 UAMO App starting...');

        // Initialize Telegram WebApp
        initTelegramWebApp();

        // Initialize Supabase
        const initResult = initSupabase();

        if (initResult) {
            // Check for existing session
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    currentUser = session.user;
                    loadUserData().then(() => {
                        loadListings();
                        loadFavorites();
                        loadChats();
                        navigateTo('home');
                    });
                } else {
                    navigateTo('auth');
                }
            }).catch(() => {
                navigateTo('auth');
            });
        } else {
            // Try again with waitForSupabase
            waitForSupabase(function() {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        currentUser = session.user;
                        loadUserData().then(() => {
                            loadListings();
                            loadFavorites();
                            loadChats();
                            navigateTo('home');
                        });
                    } else {
                        navigateTo('auth');
                    }
                });
            });
        }
    });
